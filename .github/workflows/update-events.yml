name: Aktualisiere Demonstrationen Deutschland
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-events.yml'
      - 'scripts/update-events.mjs'
      - 'scripts/update-rostock.py'
      - 'scripts/test-rostock-source.py'
      - 'scripts/test-dresden-archive.py'
      - 'scripts/update-cologne.py'
      - 'scripts/update-police-notices.py'
      - 'scripts/update-nrw-police.py'
      - 'scripts/test-nrw-police.py'
      - 'scripts/source-health-alerts.mjs'
      - 'scripts/test-source-health-alerts.mjs'
      - 'scripts/update-leipzig-police.py'
      - 'scripts/import-leipzig-archive.py'
      - 'scripts/test-leipzig-archive.py'
      - 'scripts/test-leipzig-police.py'
      - 'scripts/audit-source-quality.mjs'
      - 'scripts/test-source-quality.mjs'
      - 'scripts/test-police-notices.py'
      - 'scripts/update-frankfurt.py'
      - 'scripts/update-dortmund-police.py'
      - 'scripts/test-dortmund-police.py'
      - 'scripts/import-frankfurt-police-archive.py'
      - 'scripts/test-frankfurt-police-archive.py'
      - 'scripts/test-frankfurt.py'
      - 'scripts/test-cologne.py'
      - 'scripts/monitor-official-sources.py'
      - 'scripts/test-source-monitor.py'
      - 'scripts/update-dresden-jena.py'
      - 'scripts/update-dresden.py'
      - 'scripts/dedupe-events.py'
      - 'scripts/test-dedupe.py'
      - 'scripts/check-demos-api.py'
      - 'scripts/probe-demos-events.py'
      - 'scripts/update-demos.py'
      - 'scripts/build-language-pages.mjs'
      - 'scripts/update-news.py'
      - 'scripts/track-event-updates.py'
      - 'scripts/test-event-updates.py'
  schedule:
    - cron: "21 */6 * * *"
permissions:
  contents: write
concurrency:
  group: demoradar-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lade öffentliche Berliner Versammlungsdaten
        run: node scripts/update-events.mjs
      - name: Ergänze amtliche Versammlungen aus Rostock
        run: python3 scripts/update-rostock.py
      - name: Importiere eindeutig datierte offizielle Kölner Demonstrationshinweise
        run: python3 scripts/update-cologne.py
      - name: Prüfe konkrete Versammlungen aus amtlichen Meldungen in Bonn und Münster
        run: python3 scripts/update-nrw-police.py
      - name: Ergänze zwei ausdrücklich von Polizei Köln gemeldete Versammlungen
        run: python3 scripts/update-police-notices.py
      - name: Ergänze ausdrücklich angekündigte Leipziger Versammlungen aus der Originalmeldung
        run: python3 scripts/update-leipzig-police.py
      - name: Verifiziere historische Leipziger Versammlung vom 31. Oktober für Aufzeichnungen
        run: python3 scripts/import-leipzig-archive.py
      - name: Erfasse explizit gemeldete Frankfurter Versammlungen aus der amtlichen Mitteilung
        run: python3 scripts/update-frankfurt.py
      - name: Importiere eindeutig angekündigte Dortmunder Polizeiversammlung
        run: python3 scripts/update-dortmund-police.py
      - name: Erfasse historisch belegte Frankfurter Versammlungen für Streamarchive
        run: python3 scripts/import-frankfurt-police-archive.py
      - name: Beobachte weitere amtliche Kandidatenquellen ohne erfundene Termine
        run: python3 scripts/monitor-official-sources.py
      - name: Lade Dresdner Versammlungen aus der amtlichen JSON-Schnittstelle
        run: python3 scripts/update-dresden.py
      - name: Prüfe Dresden und Jena und importiere eindeutig gekennzeichnete Jena-Versammlungen
        run: python3 scripts/update-dresden-jena.py
      - name: Entferne konservativ echte Dubletten
        run: python3 scripts/dedupe-events.py
      - name: Prüfe das dokumentierte Schema der bundesweiten Demos-API
        run: python3 scripts/check-demos-api.py
      - name: Teste kleine öffentliche Demos-Veranstaltungsabfrage
        run: python3 scripts/probe-demos-events.py
      - name: Lade plausible bundesweite Demos-API-Termine mit separater CC-BY-SA-Kennzeichnung
        run: python3 scripts/update-demos.py
      - name: Prüfe Import-Erreichbarkeit und Quellengüte ohne Vollständigkeitsbehauptung
        run: node scripts/audit-source-quality.mjs
      - name: Melde unerreichbare und überalterte Behördenprüfungen, ohne Demos abzusagen
        run: node scripts/source-health-alerts.mjs
      - name: Vergleiche amtlich veröffentlichte Änderungen und Statusmeldungen
        run: python3 scripts/track-event-updates.py
      - name: Prüfe Nachrichten-Feeds und mögliche Berichtszuordnungen
        run: python3 scripts/update-news.py
      - name: Erzeuge zweisprachige HTML-Seiten und SEO-Dateien
        run: node scripts/build-language-pages.mjs
      - name: Prüfe Kalendercode und Datenformat
        run: |
          python3 -m py_compile scripts/update-rostock.py scripts/update-dresden.py scripts/test-rostock-source.py scripts/test-dresden-archive.py scripts/update-demos.py scripts/update-news.py scripts/track-event-updates.py scripts/update-cologne.py scripts/update-nrw-police.py scripts/update-leipzig-police.py scripts/import-leipzig-archive.py scripts/update-police-notices.py scripts/update-frankfurt.py scripts/update-dortmund-police.py scripts/import-frankfurt-police-archive.py scripts/monitor-official-sources.py
          python3 scripts/test-rostock-source.py
          python3 scripts/test-dresden-archive.py
          python3 scripts/test-cologne.py
          python3 scripts/test-police-notices.py
          python3 scripts/test-nrw-police.py
          python3 scripts/test-leipzig-police.py
          python3 scripts/test-leipzig-archive.py
          node scripts/test-source-quality.mjs
          node scripts/test-source-health-alerts.mjs
          node scripts/test-stream-matcher.mjs
          node scripts/test-source-coverage.mjs
          python3 scripts/test-frankfurt.py
          python3 scripts/test-dortmund-police.py
          python3 scripts/test-frankfurt-police-archive.py
          python3 scripts/test-source-monitor.py
          node --check heatmap.js
          python3 scripts/test-dedupe.py
          python3 scripts/test-event-updates.py
          node --check live.js
          node --check scripts/update-streams.mjs
          node --check i18n.js
          node --check scripts/build-language-pages.mjs
          node --input-type=module -e 'import{readFileSync}from"node:fs";const de=readFileSync("index.html","utf8"),en=readFileSync("en/index.html","utf8"),sitemap=readFileSync("sitemap.xml","utf8");if(!de.includes("hreflang=\"en\"")||!en.includes("<html lang=\"en\"")||!en.includes("<link rel=\"canonical\" href=\"https://demoradar.pages.dev/en/\"")||!en.includes("Important today"))throw Error("Missing translated SEO route");if(!sitemap.includes("/en/"))throw Error("Missing sitemap translation entry");console.log("/en/ static SEO checks: OK")'
          node scripts/test-i18n.mjs
          node scripts/test-frontend.mjs
          node scripts/test-community.mjs
          node --input-type=module -e 'import{readFileSync}from"node:fs";const h=readFileSync("index.html","utf8");if(!h.includes("data-language=\"de\"")||!h.includes("data-language=\"en\"")||!h.includes("/i18n.js"))throw Error("Language switch missing");console.log("DE/EN switch present")'
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const html=readFileSync("index.html","utf8"),js=readFileSync("live.js","utf8"); if(!html.includes("id=\"city\"")||!js.includes("function updateCityChoices()")||!js.includes("selectedCity"))throw Error("City filter wiring missing"); console.log("City filter wiring present");'
          python3 -c 'from html.parser import HTMLParser; p=open("index.html",encoding="utf8").read(); assert p.index("id=\"demo-kalender\"") < p.index("id=\"todaySection\""); assert p.count("id=\"calendar\"")==1; print("Calendar prominently positioned")'
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync("data/events.json", "utf8"));
            if (!Array.isArray(data.events) || data.events.length < 1) throw Error("Empty dataset");
            if (!data.events.every(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.title && e.country === "DE")) throw Error("Invalid event");
            console.log("Validated", data.events.length, "events");
          '
      - name: Commit nur bei Änderungen
        run: |
          if [ -n "$(git status --porcelain data/events.json data/source-status.json data/news-matches.json data/dresden-source.json data/demos-api-status.json data/demos-api-sample.json data/demos-events.json data/event-updates.json data/cologne-source.json data/nrw-police-source.json data/source-health-alerts.json data/leipzig-police-source.json data/leipzig-archive-source.json data/source-quality.json data/police-notices-source.json data/berlin-source.json data/rostock-source.json data/frankfurt-source.json data/dortmund-police-source.json data/frankfurt-police-archive-source.json data/expansion-sources.json index.html en/index.html sitemap.xml robots.txt)" ]; then
            git config user.name "demoradar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/events.json data/source-status.json data/news-matches.json data/dresden-source.json data/demos-api-status.json data/demos-api-sample.json data/demos-events.json data/event-updates.json data/cologne-source.json data/nrw-police-source.json data/source-health-alerts.json data/leipzig-police-source.json data/leipzig-archive-source.json data/source-quality.json data/police-notices-source.json data/berlin-source.json data/rostock-source.json data/frankfurt-source.json data/dortmund-police-source.json data/frankfurt-police-archive-source.json data/expansion-sources.json index.html en/index.html sitemap.xml robots.txt
            git commit -m "data: refresh demonstration sources and observed changes"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "Push raced with a repository update; rebasing on latest main (attempt $attempt)"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo "::error::Concurrent update conflict; source changes were not published. Retry required."; exit 1; }
              if [ "$attempt" = 3 ]; then git push; fi
            done
          else
            echo "Keine Änderungen"
          fi
