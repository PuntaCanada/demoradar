name: Aktualisiere Demonstrationen Deutschland
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-events.yml'
      - 'scripts/update-events.mjs'
      - 'scripts/update-rostock.py'
      - 'scripts/update-dresden-jena.py'
      - 'scripts/update-dresden.py'
      - 'scripts/dedupe-events.py'
      - 'scripts/test-dedupe.py'
      - 'live.js'
      - 'index.html'
      - 'scripts/update-news.py'
  schedule:
    - cron: "21 */6 * * *"
permissions:
  contents: write
concurrency:
  group: demoradar-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lade öffentliche Berliner Versammlungsdaten
        run: node scripts/update-events.mjs
      - name: Ergänze amtliche Versammlungen aus Rostock
        run: python3 scripts/update-rostock.py
      - name: Lade Dresdner Versammlungen aus der amtlichen JSON-Schnittstelle
        run: python3 scripts/update-dresden.py
      - name: Prüfe Dresden und Jena und importiere eindeutig gekennzeichnete Jena-Versammlungen
        run: python3 scripts/update-dresden-jena.py
      - name: Entferne konservativ echte Dubletten
        run: python3 scripts/dedupe-events.py
      - name: Prüfe Nachrichten-Feeds und mögliche Berichtszuordnungen
        run: python3 scripts/update-news.py
      - name: Prüfe Kalendercode und Datenformat
        run: |
          python3 scripts/test-dedupe.py
          node --check live.js
          python3 -c 'from html.parser import HTMLParser; p=open("index.html",encoding="utf8").read(); assert p.index("id=\"demo-kalender\"") < p.index("id=\"todaySection\""); assert p.count("id=\"calendar\"")==1; print("Calendar prominently positioned")'
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync("data/events.json", "utf8"));
            if (!Array.isArray(data.events) || data.events.length < 1) throw Error("Empty dataset");
            if (!data.events.every(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.title && e.country === "DE")) throw Error("Invalid event");
            console.log("Validated", data.events.length, "events");
          '
      - name: Commit nur bei Änderungen
        run: |
          if [ -n "$(git status --porcelain data/events.json data/source-status.json data/news-matches.json data/dresden-source.json)" ]; then
            git config user.name "demoradar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/events.json data/source-status.json data/news-matches.json data/dresden-source.json
            git commit -m "data: update Berlin events"
            git push
          else
            echo "Keine Änderungen"
          fi
