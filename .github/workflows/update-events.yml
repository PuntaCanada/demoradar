name: Aktualisiere Demonstrationen Deutschland
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-events.yml'
      - 'scripts/update-events.mjs'
      - 'scripts/update-rostock.py'
      - 'scripts/update-dresden-jena.py'
      - 'scripts/update-dresden.py'
      - 'scripts/dedupe-events.py'
      - 'scripts/test-dedupe.py'
      - 'scripts/check-demos-api.py'
      - 'scripts/probe-demos-events.py'
      - 'scripts/update-demos.py'
      - 'live.js'
      - 'i18n.js'
      - 'scripts/test-i18n.mjs'
      - 'scripts/test-frontend.mjs'
      - 'scripts/build-language-pages.mjs'
      - 'en/index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'index.html'
      - 'scripts/update-news.py'
      - 'scripts/track-event-updates.py'
      - 'heatmap.js'
      - 'data/germany-states.json'
  schedule:
    - cron: "21 */6 * * *"
permissions:
  contents: write
concurrency:
  group: demoradar-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lade öffentliche Berliner Versammlungsdaten
        run: node scripts/update-events.mjs
      - name: Ergänze amtliche Versammlungen aus Rostock
        run: python3 scripts/update-rostock.py
      - name: Lade Dresdner Versammlungen aus der amtlichen JSON-Schnittstelle
        run: python3 scripts/update-dresden.py
      - name: Prüfe Dresden und Jena und importiere eindeutig gekennzeichnete Jena-Versammlungen
        run: python3 scripts/update-dresden-jena.py
      - name: Entferne konservativ echte Dubletten
        run: python3 scripts/dedupe-events.py
      - name: Prüfe das dokumentierte Schema der bundesweiten Demos-API
        run: python3 scripts/check-demos-api.py
      - name: Teste kleine öffentliche Demos-Veranstaltungsabfrage
        run: python3 scripts/probe-demos-events.py
      - name: Lade plausible bundesweite Demos-API-Termine mit separater CC-BY-SA-Kennzeichnung
        run: python3 scripts/update-demos.py
      - name: Vergleiche amtlich veröffentlichte Änderungen und Statusmeldungen
        run: python3 scripts/track-event-updates.py
      - name: Prüfe Nachrichten-Feeds und mögliche Berichtszuordnungen
        run: python3 scripts/update-news.py
      - name: Erzeuge zweisprachige HTML-Seiten und SEO-Dateien
        run: node scripts/build-language-pages.mjs
      - name: Prüfe Kalendercode und Datenformat
        run: |
          python3 -m py_compile scripts/update-demos.py scripts/update-news.py scripts/track-event-updates.py
          node --check heatmap.js
          python3 scripts/test-dedupe.py
          node --check live.js
          node --check i18n.js
          node --check scripts/build-language-pages.mjs
          node --input-type=module -e 'import{readFileSync}from"node:fs";const de=readFileSync("index.html","utf8"),en=readFileSync("en/index.html","utf8"),sitemap=readFileSync("sitemap.xml","utf8");if(!de.includes("hreflang=\"en\"")||!en.includes("<html lang=\"en\"")||!en.includes("<link rel=\"canonical\" href=\"https://demoradar.pages.dev/en/\"")||!en.includes("Important today"))throw Error("Missing translated SEO route");if(!sitemap.includes("/en/"))throw Error("Missing sitemap translation entry");console.log("/en/ static SEO checks: OK")'
          node scripts/test-i18n.mjs
          node scripts/test-frontend.mjs
          node --input-type=module -e 'import{readFileSync}from"node:fs";const h=readFileSync("index.html","utf8");if(!h.includes("data-language=\"de\"")||!h.includes("data-language=\"en\"")||!h.includes("/i18n.js"))throw Error("Language switch missing");console.log("DE/EN switch present")'
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const html=readFileSync("index.html","utf8"),js=readFileSync("live.js","utf8"); if(!html.includes("id=\"city\"")||!js.includes("function updateCityChoices()")||!js.includes("selectedCity"))throw Error("City filter wiring missing"); console.log("City filter wiring present");'
          python3 -c 'from html.parser import HTMLParser; p=open("index.html",encoding="utf8").read(); assert p.index("id=\"demo-kalender\"") < p.index("id=\"todaySection\""); assert p.count("id=\"calendar\"")==1; print("Calendar prominently positioned")'
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync("data/events.json", "utf8"));
            if (!Array.isArray(data.events) || data.events.length < 1) throw Error("Empty dataset");
            if (!data.events.every(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.title && e.country === "DE")) throw Error("Invalid event");
            console.log("Validated", data.events.length, "events");
          '
      - name: Commit nur bei Änderungen
        run: |
          if [ -n "$(git status --porcelain data/events.json data/source-status.json data/news-matches.json data/dresden-source.json data/demos-api-status.json data/demos-api-sample.json data/demos-events.json data/event-updates.json index.html en/index.html sitemap.xml robots.txt)" ]; then
            git config user.name "demoradar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/events.json data/source-status.json data/news-matches.json data/dresden-source.json data/demos-api-status.json data/demos-api-sample.json data/demos-events.json data/event-updates.json index.html en/index.html sitemap.xml robots.txt
            git commit -m "data: update Berlin events"
            git push
          else
            echo "Keine Änderungen"
          fi
