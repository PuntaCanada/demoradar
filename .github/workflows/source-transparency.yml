name: Source transparency checks
on:
  pull_request:
    paths:
      - 'sources/**'
      - 'heatmap.js'
      - 'data/expansion-sources.json'
      - 'scripts/test-heatmap-freshness.mjs'
      - 'scripts/monitor-official-sources.py'
      - 'scripts/test-source-monitor.py'
      - 'scripts/stream-matcher.mjs'
      - 'scripts/test-stream-matcher.mjs'
      - 'scripts/update-streams.mjs'
      - 'data/state-source-coverage.json'
      - 'data/source-quality.json'
      - 'data/source-format-health.json'
      - 'data/source-reuse-audit.json'
      - 'scripts/test-source-reuse-audit.mjs'
      - 'scripts/check-source-admission.mjs'
      - 'scripts/test-source-transparency.mjs'
      - '.github/workflows/source-transparency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dashboard syntax and declared source evidence
        run: |
          node --check sources/source-status.js
          node scripts/test-source-transparency.mjs
          node scripts/test-source-reuse-audit.mjs
          node scripts/check-source-admission.mjs
          node scripts/test-heatmap-freshness.mjs
          node scripts/test-source-registry.mjs
          node scripts/test-heatmap-coverage.mjs
          node scripts/test-stream-matcher.mjs
          node --check scripts/update-streams.mjs
          python3 scripts/test-source-monitor.py
      - name: Verify Chromium available and run real browser regression
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node scripts/test-browser.mjs
