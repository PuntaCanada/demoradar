name: DemoRadar Stream-Suche (optional)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-streams.mjs'
      - 'scripts/stream-matcher.mjs'
      - 'scripts/test-stream-matcher.mjs'
      - 'scripts/stream-coverage-audit.mjs'
      - 'scripts/source-coverage.mjs'
      - 'scripts/test-source-coverage.mjs'
      - 'data/expansion-sources.json'
      - 'data/police-notices-source.json'
      - 'data/leipzig-police-source.json'
      - 'data/leipzig-archive-source.json'
      - 'data/nrw-police-source.json'
      - 'data/dortmund-police-source.json'
      - 'data/frankfurt-police-archive-source.json'
      - 'data/source-health-alerts.json'
      - 'scripts/test-source-health-alerts.mjs'
      - 'data/events.json'
      - 'data/demos-events.json'
      - '.github/workflows/stream-discovery.yml'
      - 'data/streamer-candidates.json'
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: demoradar-data-refresh
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax und sicheres Event-Matching prüfen
        run: |
          node --check scripts/update-streams.mjs
          node --check scripts/stream-matcher.mjs
          node scripts/test-stream-matcher.mjs
          node scripts/test-source-coverage.mjs
          node scripts/test-source-health-alerts.mjs
      - name: Prüfe bekannte Streamer über offizielle APIs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/update-streams.mjs
      - name: Analysiere reale Titel und Abdeckung, ohne automatische Freigaben
        run: node scripts/stream-coverage-audit.mjs
      - name: Erzeuge faktenbasierte Stadt-Abdeckungsdiagnose ohne Eventimport
        run: node scripts/source-coverage.mjs
      - name: Speichere ausschließlich geänderte Treffer
        run: |
          if [ -n "$(git status --porcelain data/stream-discoveries.json data/source-coverage.json)" ]; then
            git config user.name "demoradar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stream-discoveries.json data/source-coverage.json
            git commit -m "data: update potential demonstration livestream matches"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo "::error::Unpublished stream discovery due to concurrent update conflict; retry required."; exit 1; }
            done
            exit 1
          fi
          echo "Keine neuen Stream-Treffer"
