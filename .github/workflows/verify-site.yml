name: DemoRadar Website und Cloudflare prüfen
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'i18n.js'
      - 'live.js'
      - 'community/index.html'
      - 'en/community/index.html'
      - 'data/live-streams.json'
      - 'data/source-coverage.json'
      - 'data/state-source-coverage.json'
      - 'data/source-quality.json'
      - 'data/leipzig-police-source.json'
      - 'data/leipzig-archive-source.json'
      - 'data/nrw-police-source.json'
      - 'data/source-health-alerts.json'
      - 'scripts/source-health-alerts.mjs'
      - 'scripts/test-source-health-alerts.mjs'
      - 'scripts/update-nrw-police.py'
      - 'scripts/test-nrw-police.py'
      - 'scripts/import-leipzig-archive.py'
      - 'scripts/test-leipzig-archive.py'
      - 'scripts/audit-source-quality.mjs'
      - 'scripts/test-source-quality.mjs'
      - 'scripts/update-leipzig-police.py'
      - 'scripts/test-leipzig-police.py'
      - 'scripts/test-heatmap-coverage.mjs'
      - 'data/police-notices-source.json'
      - 'scripts/test-police-notices.py'
      - 'scripts/source-coverage.mjs'
      - 'scripts/test-source-coverage.mjs'
      - 'data/organizer-contacts.json'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/test-community.mjs'
      - 'heatmap.js'
      - 'data/germany-states.json'
      - 'scripts/test-frontend.mjs'
      - 'scripts/test-i18n.mjs'
      - 'scripts/test-browser.mjs'
      - 'scripts/build-language-pages.mjs'
      - '.github/workflows/verify-site.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prüfe DE und EN HTML, Übersetzungen, Kalender und Filter
        run: |
          node scripts/build-language-pages.mjs
          node --check live.js
          node --check heatmap.js
          node --check i18n.js
          node scripts/test-i18n.mjs
          node scripts/test-frontend.mjs
          node scripts/test-community.mjs
          node scripts/test-source-coverage.mjs
          node scripts/test-heatmap-coverage.mjs
          node scripts/test-source-quality.mjs
          node scripts/test-source-health-alerts.mjs
          python3 scripts/test-leipzig-police.py
          python3 scripts/test-leipzig-archive.py
          python3 scripts/test-nrw-police.py
          node --check scripts/audit-source-quality.mjs
          python3 scripts/test-police-notices.py
          node --check scripts/source-coverage.mjs
      - name: Prüfe echte Browseransicht auf Smartphone und Desktop
        run: node scripts/test-browser.mjs
      - name: Prüfe Cloudflare-HTTP-Auslieferung unabhängig von GitHub
        continue-on-error: true
        run: |
          set -eu
          for route in / /en/ /community/ /en/community/ /data/live-streams.json /data/source-coverage.json /data/state-source-coverage.json /data/source-quality.json /data/leipzig-police-source.json /data/leipzig-archive-source.json /data/nrw-police-source.json /data/source-health-alerts.json /data/police-notices-source.json /data/organizer-contacts.json /sitemap.xml /robots.txt /data/events.json /data/demos-events.json /data/event-updates.json /data/germany-states.json /i18n.js /live.js /heatmap.js; do
            url="https://demoradar.pages.dev$route"
            code=$(curl -L -sS --retry 2 --retry-delay 3 --connect-timeout 8 --max-time 25 -o /tmp/demoradar_response -w "%{http_code}" "$url") || code="000"
            echo "$route -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::warning::Cloudflare route $route returned HTTP $code"
              exit 1
            fi
            case "$route" in
              /en/) grep -q '<html lang="en">' /tmp/demoradar_response && grep -q 'id="eventDetail"' /tmp/demoradar_response || (echo "::warning::English page or event details missing on Cloudflare" && exit 1) ;;
              /) grep -q '<html lang="de">' /tmp/demoradar_response && grep -q 'id="eventDetail"' /tmp/demoradar_response || (echo "::warning::German page or event details missing on Cloudflare" && exit 1) ;;
              /community/) grep -q 'template=livestream.yml' /tmp/demoradar_response || (echo "::warning::Community and stream proposal page missing" && exit 1) ;;
              /en/community/) grep -q '<html lang="en">' /tmp/demoradar_response || (echo "::warning::English community page missing" && exit 1) ;;
              /data/live-streams.json) grep -q '"streams"' /tmp/demoradar_response || (echo "::warning::Reviewed live stream data unavailable" && exit 1) ;;
              /data/source-coverage.json) grep -q '"cities"' /tmp/demoradar_response || (echo "::warning::City coverage diagnostic not yet published" && exit 1) ;;
              /data/state-source-coverage.json) grep -q '"states"' /tmp/demoradar_response || (echo "::warning::State source coverage not deployed" && exit 1) ;;
              /data/source-quality.json) grep -q '"sources"' /tmp/demoradar_response || (echo "::warning::Importer source quality not deployed" && exit 1) ;;
              /data/leipzig-police-source.json) grep -q '"status"' /tmp/demoradar_response || (echo "::warning::Leipzig official notice result not deployed" && exit 1) ;;
              /data/leipzig-archive-source.json) grep -q '"mode"' /tmp/demoradar_response || (echo "::warning::Leipzig historical notice not deployed" && exit 1) ;;
              /data/nrw-police-source.json) grep -q '"sources"' /tmp/demoradar_response || (echo "::warning::NRW police notices not deployed" && exit 1) ;;
              /data/source-health-alerts.json) grep -q '"alerts"' /tmp/demoradar_response || (echo "::warning::Official source health warnings not deployed" && exit 1) ;;
              /data/police-notices-source.json) grep -q '"sources"' /tmp/demoradar_response || (echo "::warning::Official police notice status not deployed" && exit 1) ;;
              /data/organizer-contacts.json) grep -q '"contacts"' /tmp/demoradar_response || (echo "::warning::Public organizer contact data unavailable" && exit 1) ;;
              /sitemap.xml) grep -q 'demoradar.pages.dev/en/' /tmp/demoradar_response || (echo "::warning::English URL missing from live sitemap" && exit 1) ;;
              /data/events.json) grep -q '"events"' /tmp/demoradar_response || (echo "::warning::Live events JSON missing" && exit 1) ;;
              /data/demos-events.json) grep -q '"events"' /tmp/demoradar_response || (echo "::warning::Live community events JSON missing" && exit 1) ;;
              /robots.txt) grep -q 'sitemap.xml' /tmp/demoradar_response || (echo "::warning::Sitemap missing in robots.txt" && exit 1) ;;
              /i18n.js) grep -q 'demoradar:languagechange' /tmp/demoradar_response || (echo "::warning::Language script not deployed" && exit 1) ;;
              /data/event-updates.json) grep -q '"statuses"' /tmp/demoradar_response || (echo "::warning::Event change statuses missing" && exit 1) ;;
              /data/germany-states.json) grep -q '"states"' /tmp/demoradar_response || (echo "::warning::Local map geometry missing" && exit 1) ;;
              /heatmap.js) grep -q 'heatmapSvg' /tmp/demoradar_response || (echo "::warning::Heatmap script not deployed" && exit 1) ;;
              /live.js) grep -q 'function updateCityChoices' /tmp/demoradar_response && grep -q 'function renderDetail' /tmp/demoradar_response || (echo "::warning::Deployed calendar lacks event details" && exit 1) ;;
            esac
          done
          echo "Cloudflare endpoints are reachable and include expected data."
