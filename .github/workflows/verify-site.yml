name: DemoRadar Website und Cloudflare prüfen
on:
  pull_request:
    paths:
      - 'scripts/monitor-official-sources.py'
      - 'scripts/test-source-monitor.py'
      - '.github/workflows/verify-site.yml'
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'heute/index.html'
      - 'en/today/index.html'
      - 'scripts/test-today-pages.mjs'
      - 'scripts/today-selection.mjs'
      - 'scripts/test-today-selection.mjs'
      - 'scripts/test-seo-reciprocity.mjs'
      - 'scripts/verify-public-crawlability.mjs'
      - 'scripts/test-public-crawlability.mjs'
      - 'scripts/build-language-pages.mjs'
      - 'sources/index.html'
      - 'en/sources/index.html'
      - 'sources/source-status.js'
      - 'sources/source-status.css'
      - 'scripts/test-source-registry.mjs'
      - 'i18n.js'
      - 'live.js'
      - 'community/index.html'
      - 'en/community/index.html'
      - 'data/live-streams.json'
      - 'data/news-matches.json'
      - 'data/editorial-link-candidates.json'
      - 'scripts/test-editorial-links.py'
      - 'scripts/test-editorial-frontend.mjs'
      - 'scripts/update-news.py'
      - 'data/events.json'
      - 'data/event-count-change.json'
      - 'data/source-coverage.json'
      - 'data/state-source-coverage.json'
      - 'data/source-quality.json'
      - 'data/source-format-health.json'
      - 'data/source-reuse-audit.json'
      - 'data/rejected-official-candidates.json'
      - 'scripts/test-rejected-candidates.mjs'
      - 'scripts/test-source-reuse-audit.mjs'
      - 'scripts/check-source-admission.mjs'
      - 'scripts/source-format-health.mjs'
      - 'scripts/test-source-format-health.mjs'
      - 'data/berlin-source.json'
      - 'data/rostock-source.json'
      - 'scripts/test-rostock-source.py'
      - 'scripts/test-berlin-feed.mjs'
      - 'scripts/test-dresden-archive.py'
      - 'scripts/test-jena-archive.py'
      - 'data/leipzig-police-source.json'
      - 'data/leipzig-archive-source.json'
      - 'data/nrw-police-source.json'
      - 'data/dortmund-police-source.json'
      - 'data/frankfurt-police-archive-source.json'
      - 'scripts/update-dortmund-police.py'
      - 'scripts/update-stuttgart-demo.py'
      - 'scripts/update-regional-organizer-oneoffs.py'
      - 'scripts/update-three-regional-oneoffs.py'
      - 'scripts/test-three-regional-oneoffs.py'
      - 'scripts/test-regional-organizer-oneoffs.py'
      - 'scripts/test-stuttgart-demo.py'
      - 'scripts/test-dortmund-police.py'
      - 'scripts/import-frankfurt-police-archive.py'
      - 'scripts/test-frankfurt-police-archive.py'
      - 'data/source-health-alerts.json'
      - 'scripts/source-health-alerts.mjs'
      - 'scripts/test-source-health-alerts.mjs'
      - 'scripts/update-nrw-police.py'
      - 'scripts/test-nrw-police.py'
      - 'scripts/import-leipzig-archive.py'
      - 'scripts/test-leipzig-archive.py'
      - 'scripts/audit-source-quality.mjs'
      - 'scripts/test-source-quality.mjs'
      - 'scripts/update-leipzig-police.py'
      - 'scripts/test-leipzig-police.py'
      - 'scripts/test-heatmap-coverage.mjs'
      - 'data/police-notices-source.json'
      - 'scripts/test-police-notices.py'
      - 'scripts/source-coverage.mjs'
      - 'scripts/test-source-coverage.mjs'
      - 'data/organizer-contacts.json'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/test-community.mjs'
      - 'heatmap.js'
      - 'data/germany-states.json'
      - 'scripts/test-frontend.mjs'
      - 'scripts/test-i18n.mjs'
      - 'scripts/test-browser.mjs'
      - 'scripts/audit-future-source-evidence.py'
      - 'scripts/test-future-source-evidence.py'
      - 'scripts/monitor-official-sources.py'
      - 'scripts/test-source-monitor.py'
      - 'data/future-source-evidence.json'
      - 'scripts/check-cloudflare-dataset.mjs'
      - 'scripts/test-event-count-delta.py'
      - 'scripts/build-language-pages.mjs'
      - '.github/workflows/verify-site.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prüfe DE und EN HTML, Übersetzungen, Kalender und Filter
        run: |
          node scripts/build-language-pages.mjs
          node scripts/test-today-pages.mjs
          node scripts/test-berlin-page.mjs
          node scripts/test-today-selection.mjs
          node scripts/test-seo-reciprocity.mjs
          node scripts/test-public-crawlability.mjs
          node --check live.js
          node --check heatmap.js
          node --check i18n.js
          node scripts/test-i18n.mjs
          node scripts/test-frontend.mjs
          python3 scripts/test-three-regional-oneoffs.py
          python3 scripts/test-regional-organizer-oneoffs.py
          python3 scripts/test-stuttgart-demo.py
          python3 scripts/test-event-count-delta.py
          python3 scripts/test-future-source-evidence.py
          python3 scripts/test-source-monitor.py
          node scripts/test-community.mjs
          node scripts/test-source-coverage.mjs
          node scripts/test-heatmap-coverage.mjs
          node --check sources/source-status.js
          node scripts/test-source-registry.mjs
          node scripts/test-source-quality.mjs
          node scripts/test-source-reuse-audit.mjs
          python3 scripts/test-editorial-links.py
          node scripts/test-editorial-frontend.mjs
          node scripts/check-source-admission.mjs
          node scripts/test-rejected-candidates.mjs
          node scripts/test-berlin-feed.mjs
          python3 scripts/test-rostock-source.py
          python3 scripts/test-dresden-archive.py
          python3 scripts/test-jena-archive.py
          node scripts/test-source-health-alerts.mjs
          node scripts/test-source-format-health.mjs
          python3 scripts/test-leipzig-police.py
          python3 scripts/test-leipzig-archive.py
          python3 scripts/test-nrw-police.py
          python3 scripts/test-dortmund-police.py
          python3 scripts/test-frankfurt-police-archive.py
          node --check scripts/audit-source-quality.mjs
          python3 scripts/test-police-notices.py
          node --check scripts/source-coverage.mjs
      - name: Prüfe echte Browseransicht auf Smartphone und Desktop
        run: node scripts/test-browser.mjs
      - name: Prüfe Cloudflare-HTTP-Auslieferung unabhängig von GitHub
        # Required, not informational: never claim a passing website deployment on HTTP failure.
        continue-on-error: false
        run: |
          set -eu
          for route in / /en/ /heute/ /en/today/ /sources/ /en/sources/ /sources/source-status.js /sources/source-status.css /community/ /en/community/ /data/live-streams.json /data/news-matches.json /data/editorial-link-candidates.json /data/source-coverage.json /data/state-source-coverage.json /data/source-quality.json /data/source-format-health.json /data/source-reuse-audit.json /data/rejected-official-candidates.json /data/berlin-source.json /data/rostock-source.json /data/leipzig-police-source.json /data/leipzig-archive-source.json /data/nrw-police-source.json /data/dortmund-police-source.json /data/frankfurt-police-archive-source.json /data/source-health-alerts.json /data/police-notices-source.json /data/organizer-contacts.json /sitemap.xml /robots.txt /data/events.json /data/demos-events.json /data/event-updates.json /data/germany-states.json /i18n.js /live.js /heatmap.js; do
            url="https://demoradar.pages.dev$route"
            code=$(curl -L -sS --retry 2 --retry-delay 3 --connect-timeout 8 --max-time 25 -o /tmp/demoradar_response -w "%{http_code}" "$url") || code="000"
            # On first release, the scheduled data refresh must write the two
            # newly generated HTML routes before Cloudflare can serve them.
            # Wait for the actual deployed page; do not report success on a 404.
            if [ "$route" = "/heute/" ] || [ "$route" = "/en/today/" ]; then
              for retry in $(seq 1 18); do
                if [ "$code" = "200" ]; then break; fi
                echo "::notice::Waiting for generated $route publication (attempt $retry)"
                sleep 8
                code=$(curl -L -sS --connect-timeout 7 --max-time 12 -o /tmp/demoradar_response -w "%{http_code}" "$url") || code="000"
              done
            fi
            echo "$route -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::warning::Cloudflare route $route returned HTTP $code"
              exit 1
            fi
            case "$route" in
              /en/) grep -q '<html lang="en">' /tmp/demoradar_response && grep -q 'id="eventDetail"' /tmp/demoradar_response || (echo "::warning::English page or event details missing on Cloudflare" && exit 1) ;;
              /sources/) grep -q 'id="stateGrid"' /tmp/demoradar_response || (echo "::error::German official source registry missing" && exit 1) ;;
              /en/sources/) grep -q '<html lang="en">' /tmp/demoradar_response && grep -q 'id="stateGrid"' /tmp/demoradar_response || (echo "::error::English official source registry missing" && exit 1) ;;
              /sources/source-status.js) grep -q 'sourceFilter' /tmp/demoradar_response || (echo "::error::Source registry JavaScript missing" && exit 1) ;;
              /sources/source-status.css) grep -q 'source-card' /tmp/demoradar_response || (echo "::error::Source registry stylesheet missing" && exit 1) ;;
              /) grep -q '<html lang="de">' /tmp/demoradar_response && grep -q 'id="eventDetail"' /tmp/demoradar_response || (echo "::warning::German page or event details missing on Cloudflare" && exit 1) ;;
              /community/) grep -q 'template=livestream.yml' /tmp/demoradar_response || (echo "::warning::Community and stream proposal page missing" && exit 1) ;;
              /en/community/) grep -q '<html lang="en">' /tmp/demoradar_response || (echo "::warning::English community page missing" && exit 1) ;;
              /data/live-streams.json) grep -q '"streams"' /tmp/demoradar_response || (echo "::warning::Reviewed live stream data unavailable" && exit 1) ;;
              /data/news-matches.json) grep -q '"matches"' /tmp/demoradar_response || (echo "::error::Editorial links not deployed" && exit 1) ;;
              /data/editorial-link-candidates.json) grep -q '"reviewed_on"' /tmp/demoradar_response || (echo "::error::Editorial source evidence not deployed" && exit 1) ;;
              /data/source-coverage.json) grep -q '"cities"' /tmp/demoradar_response || (echo "::warning::City coverage diagnostic not yet published" && exit 1) ;;
              /data/state-source-coverage.json) grep -q '"states"' /tmp/demoradar_response || (echo "::warning::State source coverage not deployed" && exit 1) ;;
              /data/source-quality.json) grep -q '"sources"' /tmp/demoradar_response || (echo "::warning::Importer source quality not deployed" && exit 1) ;;
              /data/source-format-health.json) grep -q '"feeds"' /tmp/demoradar_response || (echo "::error::Official format health report not deployed" && exit 1) ;;
              /data/source-reuse-audit.json) grep -q '"restricted_metadata"' /tmp/demoradar_response || (echo "::error::Public licence audit not deployed" && exit 1) ;;
              /data/rejected-official-candidates.json) grep -q '"rejected_not_an_assembly_calendar"' /tmp/demoradar_response || (echo "::error::Official candidate rejection audit missing" && exit 1) ;;
              /data/berlin-source.json) grep -q '"checked_on"' /tmp/demoradar_response || (echo "::error::Berlin source fetch status not deployed" && exit 1) ;;
              /data/rostock-source.json) grep -q '"checked_on"' /tmp/demoradar_response || (echo "::error::Rostock source fetch status not deployed" && exit 1) ;;
              /data/leipzig-police-source.json) grep -q '"status"' /tmp/demoradar_response || (echo "::warning::Leipzig official notice result not deployed" && exit 1) ;;
              /data/leipzig-archive-source.json) grep -q '"mode"' /tmp/demoradar_response || (echo "::warning::Leipzig historical notice not deployed" && exit 1) ;;
              /data/nrw-police-source.json) grep -q '"sources"' /tmp/demoradar_response || (echo "::warning::NRW police notices not deployed" && exit 1) ;;
              /data/dortmund-police-source.json) grep -q '"mode"' /tmp/demoradar_response || (echo "::warning::Dortmund police notice not deployed" && exit 1) ;;
              /data/frankfurt-police-archive-source.json) grep -q '"mode"' /tmp/demoradar_response || (echo "::warning::Frankfurt archive police notice not deployed" && exit 1) ;;
              /data/source-health-alerts.json) grep -q '"alerts"' /tmp/demoradar_response || (echo "::warning::Official source health warnings not deployed" && exit 1) ;;
              /data/police-notices-source.json) grep -q '"sources"' /tmp/demoradar_response || (echo "::warning::Official police notice status not deployed" && exit 1) ;;
              /data/organizer-contacts.json) grep -q '"contacts"' /tmp/demoradar_response || (echo "::warning::Public organizer contact data unavailable" && exit 1) ;;
              /sitemap.xml) grep -q 'demoradar.pages.dev/en/' /tmp/demoradar_response && grep -q 'demoradar.pages.dev/heute/' /tmp/demoradar_response && grep -q 'demoradar.pages.dev/en/today/' /tmp/demoradar_response || (echo "::error::Bilingual today pages missing from deployed sitemap" && exit 1) ;;
              /heute/) grep -q 'Demonstrationen heute' /tmp/demoradar_response || (echo "::error::German today page not deployed" && exit 1) ;;
              /en/today/) grep -q 'Demonstrations today' /tmp/demoradar_response || (echo "::error::English today page not deployed" && exit 1) ;;
              /data/events.json) grep -q '"events"' /tmp/demoradar_response || (echo "::warning::Live events JSON missing" && exit 1) ;;
              /data/demos-events.json) grep -q '"events"' /tmp/demoradar_response || (echo "::warning::Live community events JSON missing" && exit 1) ;;
              /robots.txt) grep -q 'sitemap.xml' /tmp/demoradar_response || (echo "::warning::Sitemap missing in robots.txt" && exit 1) ;;
              /i18n.js) grep -q 'demoradar:languagechange' /tmp/demoradar_response || (echo "::warning::Language script not deployed" && exit 1) ;;
              /data/event-updates.json) grep -q '"statuses"' /tmp/demoradar_response || (echo "::warning::Event change statuses missing" && exit 1) ;;
              /data/germany-states.json) grep -q '"states"' /tmp/demoradar_response || (echo "::warning::Local map geometry missing" && exit 1) ;;
              /heatmap.js) grep -q 'heatmapSvg' /tmp/demoradar_response || (echo "::warning::Heatmap script not deployed" && exit 1) ;;
              /live.js) grep -q 'function updateCityChoices' /tmp/demoradar_response && grep -q 'function renderDetail' /tmp/demoradar_response || (echo "::warning::Deployed calendar lacks event details" && exit 1) ;;
            esac
          done
          echo "Cloudflare endpoints are reachable and include expected data."
      - name: Teste Veröffentlichung nach Daten-Push offline
        run: node scripts/test-publication-after-refresh.mjs
      - name: Prüfe Hash und Anzahl des tatsächlich ausgelieferten Cloudflare-Datenbestands
        run: node scripts/check-cloudflare-dataset.mjs
      - name: Prüfe öffentliche Crawlability nur nach Main-Veröffentlichung
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            node scripts/verify-public-crawlability.mjs --live
          else
            echo "PR/branch: production route is not deployed yet; offline Berlin crawlability is tested above. Live verification remains mandatory after main publication."
          fi
